		<style>
			:root {
				--bg: #0d1117;
				--panel: #151b23;
				--panel2: #1c232d;
				--border: #2a323d;
				--text: #e6edf3;
				--muted: #8b98a5;
				--muted2: #5d6a78;
				--green: #3fb950;
				--red: #e05252;
				--amber: #d29922;
				--blue: #5b8def;
				--mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
				--sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
				--radius: 8px;
				--c-1: #5b8def;
				--c-2: #e3b341;
				--c-3: #c297ff;
				--c-4: #ff8a3d;
				--header-1: #12181f;
				--header-2: #0d1117;
				--log-bg: #05070a;
				--log-text: #e6edf3
			}

			:root[data-theme="light"] {
				--bg: #f2f4f7;
				--panel: #fff;
				--panel2: #eef1f5;
				--border: #d7dde3;
				--text: #1c232d;
				--muted: #5b6673;
				--muted2: #8b98a5;
				--header-1: #fff;
				--header-2: #f2f4f7;
				--log-bg: #f2f4f7;
				--log-text: #1c232d
			}

			* {
				box-sizing: border-box
			}

			html,
			body {
				margin: 0;
				padding: 0;
				background: var(--bg);
				color: var(--text);
				font-family: var(--sans);
				font-size: 14px;
				overflow-x: hidden;
				transition: background .2s ease, color .2s ease
			}

			body {
				min-height: 100vh;
				display: flex;
				flex-direction: column
			}

			code,
			.mono,
			input,
			select,
			textarea,
			table {
				font-family: var(--mono)
			}

			input,
			select,
			textarea,
			button {
				font-size: 13px
			}

			header.topbar {
				display: flex;
				flex-direction: column;
				gap: 10px;
				padding: 14px 20px;
				border-bottom: 1px solid var(--border);
				background: linear-gradient(180deg, var(--header-1), var(--header-2))
			}

			.topbar-row {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 10px;
				flex-wrap: wrap
			}

			.topbar-actions {
				display: flex;
				align-items: center;
				gap: 8px
			}

			.language-select {
				min-width: 72px;
				width: auto;
				padding: 5px 7px;
				font-family: var(--sans)
			}

			header.topbar h1 {
				font-size: 17px;
				margin: 0;
				font-weight: 600;
				letter-spacing: .2px
			}

			header.topbar h1 .dim {
				color: var(--muted);
				font-weight: 400
			}

			.pills {
				display: flex;
				gap: 10px;
				flex-wrap: wrap
			}

			.pill {
				display: flex;
				align-items: center;
				gap: 8px;
				background: var(--panel);
				border: 1px solid var(--border);
				border-radius: 999px;
				padding: 5px 12px 5px 8px;
				font-size: 12.5px;
				color: var(--muted)
			}

			.pill .dot {
				width: 9px;
				height: 9px;
				border-radius: 50%;
				background: var(--muted2);
				flex: none
			}

			.pill.on .dot {
				background: var(--green);
				box-shadow: 0 0 6px var(--green)
			}

			.pill.off .dot {
				background: var(--red)
			}

			.pill b {
				color: var(--text)
			}

			@media (max-width:600px) {
				.pill-status {
					display: none
				}
			}

			.theme-toggle {
				width: 52px;
				height: 28px;
				border-radius: 999px;
				border: none;
				cursor: pointer;
				padding: 0;
				position: relative;
				flex: none;
				background: #40464e;
				/* #0d1520 */
				transition: background .25s ease
			}

			.theme-toggle-knob {
				position: absolute;
				top: 3px;
				left: 3px;
				width: 22px;
				height: 22px;
				border-radius: 50%;
				background: #38bdf8;
				color: #fff;
				display: flex;
				align-items: center;
				justify-content: center;
				transform: translateX(24px);
				transition: transform .25s ease, background .25s ease
			}

			.theme-toggle-knob svg {
				width: 14px;
				height: 14px
			}

			.theme-toggle .icon-sun {
				display: none
			}

			.theme-toggle .icon-moon {
				display: block
			}

			:root[data-theme="light"] .theme-toggle {
				background: #fde68a
			}

			:root[data-theme="light"] .theme-toggle-knob {
				transform: translateX(0);
				background: #f5a524
			}

			:root[data-theme="light"] .theme-toggle .icon-sun {
				display: block
			}

			:root[data-theme="light"] .theme-toggle .icon-moon {
				display: none
			}

			nav.tabs {
				display: flex;
				gap: 2px;
				padding: 0 14px;
				background: var(--panel);
				border-bottom: 1px solid var(--border);
				overflow-x: auto
			}

			nav.tabs button {
				background: none;
				border: none;
				color: var(--muted);
				padding: 11px 14px;
				cursor: pointer;
				font-size: 13px;
				border-bottom: 2px solid transparent;
				white-space: nowrap
			}

			nav.tabs button:hover {
				color: var(--text)
			}

			nav.tabs button.active {
				color: var(--text);
				border-bottom-color: var(--blue)
			}

			main {
				flex: 1;
				padding: 20px;
				max-width: 1900px;
				width: 100%;
				margin: 0 auto
			}

			.grid {
				display: grid;
				gap: 14px;
				min-width: 0
			}

			.grid.cols-2 {
				grid-template-columns: 1fr 1fr
			}

			.grid.cols-3 {
				grid-template-columns: repeat(3, 1fr)
			}

			@media (min-width:821px) and (max-width:1300px) {

				#dashGrid,
				#dashDetailGrid {
					grid-template-columns: repeat(2, minmax(0, 1fr)) !important
				}
			}

			@media (max-width:820px) {

				#dashGrid,
				#dashDetailGrid {
					grid-template-columns: 1fr !important
				}

				.grid.cols-2,
				.grid.cols-3 {
					grid-template-columns: 1fr
				}
			}

			.donut-groups {
				display: grid;
				grid-template-columns: minmax(0, 1fr);
				gap: 14px
			}

			.donut-group {
				display: grid;
				grid-template-columns: repeat(var(--server-count), minmax(0, 1fr));
				gap: 14px;
				min-width: 0
			}

			@media (min-width:821px) and (max-width:1300px) {
				.donut-groups {
					grid-template-columns: repeat(2, minmax(0, 1fr))
				}

				.donut-group {
					grid-template-columns: minmax(0, 1fr);
					align-content: start
				}
			}

			@media (max-width:820px) {
				.donut-group {
					grid-template-columns: minmax(0, 1fr)
				}
			}

			.card {
				background: var(--panel);
				border: 1px solid var(--border);
				border-radius: var(--radius);
				padding: 16px;
				min-width: 0;
				box-sizing: border-box
			}

			.card h2 {
				margin: 0 0 12px;
				font-size: 14px;
				font-weight: 600;
				display: flex;
				align-items: center;
				gap: 8px
			}

			.card h2 .tag {
				font-size: 11px;
				padding: 2px 7px;
				border-radius: 5px;
				font-weight: 600;
				letter-spacing: .3px
			}

			.tag-1 {
				background: color-mix(in srgb, var(--c-1) 22%, transparent);
				color: var(--c-1)
			}

			.tag-2 {
				background: color-mix(in srgb, var(--c-2) 22%, transparent);
				color: var(--c-2)
			}

			.tag-3 {
				background: color-mix(in srgb, var(--c-3) 22%, transparent);
				color: var(--c-3)
			}

			.tag-4 {
				background: color-mix(in srgb, var(--c-4) 22%, transparent);
				color: var(--c-4)
			}

			.tag-combo {
				background: color-mix(in srgb, var(--green) 22%, transparent);
				color: var(--green)
			}

			.stat-row {
				display: flex;
				justify-content: space-between;
				padding: 6px 0;
				border-bottom: 1px dashed var(--border);
				font-size: 13px
			}

			.stat-row:last-child {
				border-bottom: none
			}

			.stat-row .k {
				color: var(--muted)
			}

			.stat-row .v {
				font-weight: 600
			}

			.big-num {
				font-size: 26px;
				font-weight: 700;
				line-height: 1.1
			}

			.sub {
				color: var(--muted);
				font-size: 12px
			}

			button.btn {
				background: var(--panel2);
				border: 1px solid var(--border);
				color: var(--text);
				padding: 7px 13px;
				border-radius: 6px;
				cursor: pointer;
				font-size: 13px
			}

			button.btn:hover {
				border-color: var(--blue)
			}

			button.btn:disabled {
				opacity: .5;
				cursor: not-allowed
			}

			button.btn.primary {
				background: var(--blue);
				border-color: var(--blue);
				color: #06101f;
				font-weight: 600
			}

			button.btn.danger {
				background: transparent;
				border-color: var(--red);
				color: var(--red)
			}

			button.btn.danger:hover {
				background: color-mix(in srgb, var(--red) 15%, transparent)
			}

			button.btn.success {
				background: var(--green);
				border-color: var(--green);
				color: #06210d;
				font-weight: 600
			}

			button.btn.xs {
				padding: 3px 8px;
				font-size: 11.5px
			}

			button.btn.block {
				width: 100%
			}

			.row-inline {
				display: flex;
				gap: 8px;
				flex-wrap: wrap;
				align-items: center
			}

			input[type=text],
			input[type=password],
			input[type=number],
			select {
				background: var(--bg);
				border: 1px solid var(--border);
				color: var(--text);
				padding: 7px 9px;
				border-radius: 6px;
				min-width: 0
			}

			label.field {
				display: flex;
				flex-direction: column;
				gap: 4px;
				font-size: 12px;
				color: var(--muted);
				flex: 1;
				min-width: 140px
			}

			label.field input,
			label.field select {
				width: 100%
			}

			table.datatable {
				width: 100%;
				border-collapse: collapse;
				font-size: 12.5px
			}

			table.datatable th {
				text-align: left;
				color: var(--muted);
				font-weight: 600;
				font-size: 11.5px;
				text-transform: none;
				padding: 8px;
				border-bottom: 1px solid var(--border);
				position: sticky;
				top: 0;
				background: var(--panel)
			}

			table.datatable td {
				padding: 7px 8px;
				border-bottom: 1px solid var(--border);
				vertical-align: middle
			}

			table.datatable tr:hover td {
				background: var(--panel2)
			}

			table.datatable tr.row-mismatch td {
				background: color-mix(in srgb, var(--red) 14%, var(--panel))
			}

			table.datatable tr.row-mismatch:hover td {
				background: color-mix(in srgb, var(--red) 20%, var(--panel))
			}

			.server-chip {
				display: inline-block;
				padding: 1px 7px;
				border-radius: 5px;
				font-size: 11px;
				font-weight: 600
			}

			.server-chip.s1 {
				background: color-mix(in srgb, var(--c-1) 20%, transparent);
				color: var(--c-1)
			}

			.server-chip.s2 {
				background: color-mix(in srgb, var(--c-2) 20%, transparent);
				color: var(--c-2)
			}

			.server-chip.s3 {
				background: color-mix(in srgb, var(--c-3) 20%, transparent);
				color: var(--c-3)
			}

			.server-chip.s4 {
				background: color-mix(in srgb, var(--c-4) 20%, transparent);
				color: var(--c-4)
			}

			.badge {
				padding: 1px 7px;
				border-radius: 5px;
				font-size: 11px;
				font-weight: 600
			}

			.badge.on {
				background: color-mix(in srgb, var(--green) 20%, transparent);
				color: var(--green)
			}

			.badge.off {
				background: color-mix(in srgb, var(--red) 20%, transparent);
				color: var(--red)
			}

			.table-wrap {
				max-height: 520px;
				overflow: auto;
				border: 1px solid var(--border);
				border-radius: 6px
			}

			.table-wrap table {
				margin: 0
			}

			.list-table-wrap table {
				min-width: 750px
			}

			.list-table-wrap th:first-child,
			.list-table-wrap td:first-child {
				min-width: 200px;
				width: 200px;
				overflow-wrap: anywhere
			}

			.client-table-wrap table {
				min-width: 650px
			}

			.client-table-wrap th:first-child,
			.client-table-wrap td:first-child {
				min-width: 140px
			}

			.client-table-wrap th:nth-child(2),
			.client-table-wrap td:nth-child(2) {
				min-width: 190px
			}

			.toast-area {
				position: fixed;
				bottom: 16px;
				right: 16px;
				display: flex;
				flex-direction: column;
				gap: 8px;
				z-index: 999;
				max-width: 360px
			}

			.toast {
				background: var(--panel2);
				border: 1px solid var(--border);
				border-left: 4px solid var(--blue);
				padding: 10px 12px;
				border-radius: 6px;
				font-size: 12.5px;
				box-shadow: 0 6px 18px #0006
			}

			.toast.ok {
				border-left-color: var(--green)
			}

			.toast.err {
				border-left-color: var(--red)
			}

			details.help {
				background: var(--panel);
				border: 1px solid var(--border);
				border-radius: var(--radius);
				padding: 12px 16px;
				margin-bottom: 16px
			}

			details.help summary {
				cursor: pointer;
				font-weight: 600;
				font-size: 13px
			}

			details.help .help-body {
				margin-top: 10px;
				font-size: 12.5px;
				color: var(--muted);
				line-height: 1.55
			}

			details.help .help-body code {
				background: var(--panel2);
				padding: 1px 5px;
				border-radius: 4px;
				color: var(--text)
			}

			details.help .help-body h3 {
				color: var(--text);
				font-size: 12.5px;
				margin: 14px 0 4px
			}

			pre.log {
				background: var(--log-bg);
				color: var(--log-text);
				border: 1px solid var(--border);
				border-radius: 6px;
				padding: 12px;
				font-size: 12px;
				line-height: 1.5;
				max-height: 360px;
				overflow: auto;
				white-space: pre-wrap;
				word-break: break-all
			}

			.empty {
				color: var(--muted);
				font-size: 13px;
				padding: 20px;
				text-align: center
			}

			.muted {
				color: var(--muted)
			}

			.flex-between {
				display: flex;
				justify-content: space-between;
				align-items: center;
				gap: 10px;
				flex-wrap: wrap
			}

			.target-select {
				min-width: 170px
			}

			hr.sep {
				border: none;
				border-top: 1px solid var(--border);
				margin: 14px 0
			}

			.bar-row {
				margin-bottom: 9px;
				min-width: 0
			}

			.bar-row .bar-label {
				display: flex;
				justify-content: space-between;
				gap: 8px;
				font-size: 12px;
				min-width: 0
			}

			.bar-row .bar-label .name {
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				max-width: 75%;
				min-width: 0;
				flex-shrink: 1
			}

			.bar-row .bar-label .muted {
				flex-shrink: 0
			}

			.bar-track {
				background: var(--panel2);
				border-radius: 4px;
				height: 6px;
				overflow: hidden;
				margin-top: 3px
			}

			.bar-fill {
				height: 100%;
				border-radius: 4px
			}

			.bar-fill.allowed {
				background: var(--green)
			}

			.bar-fill.blocked {
				background: var(--red)
			}

			.bar-fill.neutral {
				background: var(--blue)
			}

			h3.mini-title {
				font-size: 12.5px;
				color: var(--muted);
				margin: 16px 0 8px;
				font-weight: 600
			}

			h3.mini-title:first-of-type {
				margin-top: 0
			}

			.update-dot {
				display: inline-block;
				width: 9px;
				height: 9px;
				margin-left: 7px;
				border-radius: 50%;
				background: #e05252;
				vertical-align: middle;
			}

			.overview-grid {
				--overview-card-min: 300px;
				display: flex;
				flex-wrap: wrap;
				gap: 14px;
				margin-bottom: 14px;
				align-items: stretch;
			}

			#overviewComparisons>.overview-actions {
				margin-top: 0
			}

			.ansi-bold {
				font-weight: 700
			}

			.ansi-gray {
				color: var(--muted)
			}

			.ansi-red {
				color: var(--red)
			}

			.ansi-green {
				color: var(--green)
			}

			.ansi-yellow {
				color: var(--amber)
			}

			.ansi-blue {
				color: #5b8def
			}

			.ansi-purple {
				color: #c297ff
			}

			.ansi-cyan {
				color: #56d4dd
			}

			.cname-form .field {
				flex: 1 1 180px;
				min-width: 0;
			}

			.cname-form input {
				width: 100%;
				box-sizing: border-box;
			}

			#cnameSection {
				scroll-margin-top: 16px;
			}

			.overview-grid>.card {
				flex: 1 1 min(100%, var(--overview-card-min));
				min-width: 0;
				align-self: stretch;
			}

			.overview-grid>.card h2 {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 12px;
			}

			.overview-status {
				width: 9px;
				height: 9px;
				border-radius: 50%;
				background: var(--muted2);
				flex: none;
				display: inline-block;
			}

			.overview-status.ok {
				background: var(--green);
				box-shadow: 0 0 6px var(--green);
			}

			.overview-status.warning {
				background: var(--amber);
			}

			.overview-status.off {
				background: var(--red);
			}

			.group-admin-list {
				display: grid;
				gap: 12px;
				margin-top: 16px;
			}

			.group-admin-item {
				border-top: 1px solid var(--border);
				padding-top: 12px;
				overflow-wrap: anywhere;
			}

			.group-admin-item h3 {
				margin: 0 0 6px;
			}

			.group-admin-form {
				display: grid;
				gap: 10px;
				margin-top: 14px;
			}

			.group-create-form .field {
				flex: 1 1 200px;
				min-width: 0;
			}

			.group-create-form input[type=text],
			.group-create-form select {
				width: 100%;
				box-sizing: border-box;
			}

			.group-admin-form input[type=text] {
				width: 100%;
				box-sizing: border-box;
			}

			.notice {
				border-left: 3px solid var(--amber);
				padding: 8px 12px;
				background: var(--panel2);
			}

			.version-difference {
				color: var(--amber);
			}

			.group-membership {
				display: flex;
				flex-direction: column;
				align-items: flex-start;
				gap: 5px;
				margin-top: 7px;
				max-width: 280px;
				overflow-wrap: anywhere;
			}

			.group-dialog {
				background: var(--panel);
				color: var(--text);
				border: 1px solid var(--border);
				border-radius: var(--radius);
				padding: 24px;
				width: min(560px, 94vw);
				max-height: 90vh;
			}

			.group-dialog::backdrop {
				background: #0009
			}

			.queue-error {
				white-space: pre-line;
			}

			.source-choice {
				display: flex;
				flex-direction: column;
				align-items: flex-start;
				gap: 4px;
			}

			.group-options {
				display: grid;
				gap: 12px;
				max-height: 40vh;
				overflow: auto;
				padding: 10px 0;
			}

			.group-error {
				color: var(--red);
			}

			.difference-list {
				max-height: 350px;
				overflow: auto;
				padding-left: 22px;
				overflow-wrap: anywhere;
			}

			.difference-list li {
				margin-bottom: 8px;
			}

			.overview-actions {
				margin-top: 14px;
			}

			.overview-grid a {
				color: var(--blue);
			}

			#queuePanel .log {
				max-height: 260px;
				white-space: pre-wrap;
				overflow-wrap: anywhere;
			}

			#overviewTargets {
				flex-wrap: wrap;
				gap: 14px;
			}
		</style>

			const APP_VERSION = "1.5.011";

			/* Versionstjek: version.js indeholder kun fx v1.5.011, aldrig eksekverbar kode.
			 * /versioncheck/ skal proxys via nginx. Ingen Pi-hole loginoplysninger sendes.
			 * Tekster vedligeholdes i I18N sammen med resten af brugerfladen. */

			// Sæt kun til true i Docker udgaven. Almindelig download bruger false.
			const DOCKER_INSTALLATION = false;
			const VERSION_SESSION_KEY = "ph_versioncheck_" + APP_VERSION;
			const versionCheckState = { status: "idle", latest: null };
			function parseReleaseVersion(value) {
				const match = /^v?(\d{1,9})\.(\d{1,9})\.(\d{1,9})$/u.exec(String(value).trim());
				return match ? match.slice(1).map(Number) : null;
			}
			function isNewerRelease(latest, current) {
				for (let i = 0; i < 3; i++) {
					if (latest[i] !== current[i]) return latest[i] > current[i];
				}
				return false;
			}
			function hasAvailableUpdate() {
				if (!DOCKER_INSTALLATION) return false;
				const latest = parseReleaseVersion(versionCheckState.latest || "");
				return latest !== null && isNewerRelease(latest, parseReleaseVersion(APP_VERSION));
			}
			function updateBadgeHtml() {
				if (!hasAvailableUpdate()) return "";
				const label = msg("updates.available", { latest: versionCheckState.latest, current: APP_VERSION });
				return `<span class="update-dot" role="img" aria-label="${escapeHtml(label)}" title="${escapeHtml(label)}"></span>`;
			}
			function renderVersionCheck() {
				const settingsButton = document.querySelector('#tabs button[data-tab="settings"]');
				if (settingsButton) settingsButton.innerHTML = htmlMsg("tabs.settings") + updateBadgeHtml();
				const area = document.getElementById("versionCheckStatus");
				if (!area) return;
				area.hidden = !DOCKER_INSTALLATION;
				if (!DOCKER_INSTALLATION) { area.replaceChildren(); return; }
				area.replaceChildren();
				const status = versionCheckState.status === "idle" ? "checking" : versionCheckState.status;
				area.textContent = msg("updates." + (status === "update" ? "available" : status), { current: APP_VERSION, latest: versionCheckState.latest || "" });
				if (hasAvailableUpdate()) {
					const link = document.createElement("a");
					link.href = "https://github.com/tursoe/Dobbelt-Pi-hole/releases";
					link.target = "_blank";
					link.rel = "noopener noreferrer";
					link.textContent = msg("updates.releases");
					area.append(" ", link);
					const instructions = document.createElement("p");
					instructions.textContent = msg("updates.dockerInstructions");
					const commands = document.createElement("pre"), code = document.createElement("code");
					code.textContent = "docker compose pull\ndocker compose up -d";
					commands.style.whiteSpace = "pre-wrap";
					commands.style.overflowWrap = "anywhere";
					commands.append(code);
					area.append(instructions, commands);
				}
			}
			async function checkForUpdates() {
				if (!DOCKER_INSTALLATION) return;
				// Ét forsøg pr. session, også efter fejl. Indstillinger må kun vise resultatet igen.
				if (versionCheckState.status !== "idle") return;
				versionCheckState.status = "checking";
				// Gem også forsøget: genindlæsning i samme session udløser ikke nye kald.
				storeValue(VERSION_SESSION_KEY, JSON.stringify({ status: "error", latest: versionCheckState.latest }), "sessionStorage");
				renderVersionCheck();
				const controller = new AbortController();
				const timeout = setTimeout(() => controller.abort(), 8000);
				try {
					const response = await fetch("/versioncheck/", {
						cache: "no-store", credentials: "omit", referrerPolicy: "no-referrer", signal: controller.signal
					});
					if (!response.ok) throw new Error("Version endpoint HTTP " + response.status);
					const raw = (await response.text()).trim();
					const latest = parseReleaseVersion(raw);
					const current = parseReleaseVersion(APP_VERSION);
					if (!latest || !current) throw new Error("Invalid release version");
					versionCheckState.latest = raw.replace(/^v/u, "");
					versionCheckState.status = isNewerRelease(latest, current) ? "update" : "current";
				} catch {
					versionCheckState.status = "error";
				} finally {
					clearTimeout(timeout);
					storeValue(VERSION_SESSION_KEY, JSON.stringify(versionCheckState), "sessionStorage");
					renderVersionCheck();
				}
			}
			function initVersionCheck() {
				if (!DOCKER_INSTALLATION) return;
				try {
					const cached = JSON.parse(storedValue(VERSION_SESSION_KEY, "sessionStorage") || "null");
					if (cached && ["current", "update", "error"].includes(cached.status)
						&& (cached.latest === null || parseReleaseVersion(cached.latest))) {
						versionCheckState.latest = cached.latest;
						versionCheckState.status = cached.status;
						renderVersionCheck();
						return;
					}
				} catch { /* Ugyldig eller utilgængelig sessionslagring: tjek ved åbning. */ }
				void checkForUpdates();
			}

			const LANGUAGE_KEY = "ph_combo_language";

			const LANGUAGE_V010_KEYS = Object.freeze(Object.entries({

				"charts": "queryTypes libraryUnavailable queriesOverTime clientActivityOverTime upstreamServers blocked cached forwarded other otherClients.one otherClients.other unknownUpstream",
				"queries": "timeRange rangeHours.one rangeHours.other rangeDays.one rangeDays.other domainClientFilter domainClientPlaceholder server all client allClients type allTypes pageSize reload loading loginRequired empty time status domain serverError loadingMore.one loadingMore.other total.one total.other truncated.one truncated.other",
				"domains": "loading domain type kind comment missing add delete empty addTitle domainOrRegex domainPlaceholder allow block exact regex optional addTo title reload loginRequired active deactivate ruleBlock ruleRegex notLoggedIn added updated confirmDelete deleted disabled activate requestError",
				"hosts": "addTitle ipAddress domainName hostnamePlaceholder addTo add title reload loading empty active missing delete exampleIntro exampleRecord loginRequired nameHeading useSource confirmReplace updated restoredAfterFailure restoreFailed confirmDelete deleted notLoggedIn promptIp added requestError",
				"clients": "addTitle identifierHelp client description descriptionPlaceholder addTo add title pageSize all reload loading unknownTitle unknownHelp empty active missing delete unknownEmpty identifier knownNames vendor seenBy name clientHeading descriptionHeading notLoggedIn added confirmDelete deleted.one loginRequired deleted.other requestError",
				"lists": "loading url type comment missing add delete empty addTitle block allow optional addTo title reload loginRequired active ruleAllow confirmDelete deleted notLoggedIn added disabled requestError",
				"gravity": "title lastUpdate loading notLoggedIn statusError updateServer ready running done httpError error",
				"settings": "helpSummary proxyRequirement proxyExample proxyConfiguration appPasswordTitle appPasswordHelp sessionsTitle sessionsHelp title namesHelp server label save saved"
			}).flatMap(([prefix, keys]) => keys.split(' ').map(key => prefix + '.' + key)));
			/** Registrér og validér valgfrie sprogbidrag uden at ændre de indbyggede sprog. */
			function availableLanguages(additions = window.PIHOLE_LANGUAGES) {
				const languages = {
					da: { label: "Dansk", locale: "da-DK" },
					en: { label: "English", locale: "en-GB" },
					nn: { label: "Norsk nynorsk", locale: "nn-NO", author: "Roy-Magne Mo" },
					nb: { label: "Norsk bokmål", locale: "nb-NO", author: "Roy-Magne Mo" }
				};
				if (!additions || typeof additions !== "object" || Array.isArray(additions)) return languages;

				const requiredKeys = LANGUAGE_V010_KEYS.filter(key => !key.startsWith('updates.'));
				const parameters = text => [...new Set(text.match(/\{[A-Za-z][A-Za-z0-9_]*\}/gu) || [])].sort().join(",");
				for (const [code, pack] of Object.entries(additions)) {
					if (!/^[a-z]{2,3}$/u.test(code) || Object.hasOwn(languages, code)) continue;
					if (!pack || typeof pack.label !== "string" || !pack.label.trim()
						|| typeof pack.locale !== "string" || !pack.messages || typeof pack.messages !== "object") continue;
					const messages = pack.messages;
					// Alle oprindelige tekster kræves. updates.* var også valgfri i 010.
					if (Array.isArray(messages) || !requiredKeys.every(key => Object.hasOwn(messages, key))) continue;
					try {
						new Intl.NumberFormat(pack.locale);
						new Intl.DateTimeFormat(pack.locale);
						new Intl.PluralRules(pack.locale);
					} catch { continue; }
					const entries = Object.entries(messages);
					if (!entries.every(([key, value]) => Object.hasOwn(I18N.en, key)
						&& typeof value === 'string' && value.trim()
						&& parameters(value) === parameters(I18N.en[key]))) continue;

					I18N[code] = { ...messages };
					languages[code] = {
						label: pack.label.trim(),
						locale: pack.locale,
						author: typeof pack.author === "string" ? pack.author.trim() : ""
					};
				}
				return languages;
			}


			const SUPPORTED_LANGUAGES = Object.freeze(availableLanguages());

			/** Vis kreditering for det valgte sprogbidrag. */
			function updateLanguageCredit() {
				const element = document.getElementById("languageCredit");
				const author = SUPPORTED_LANGUAGES[currentLanguage]?.author;
				if (element) element.textContent = author ? msg("common.languageCredit", { author }) : "";
			}

			/** Læs en gemt browserindstilling, hvis browseren tillader lokal lagring. */
			function storedValue(key, storageName = "localStorage") {
				try { return window[storageName].getItem(key); } catch { return null; }
			}

			/** Gem en indstilling, når browserens lager er tilgængeligt. */
			function storeValue(key, value, storageName = "localStorage") {
				try {
					if (value === null) window[storageName].removeItem(key);
					else window[storageName].setItem(key, value);
				} catch { /* Indstillinger og sessioner bevares i hukommelsen, mens siden er åben. */ }
			}

			/** Normalisér understøttede sprogkoder, herunder regionale varianter som de-AT. */
			function normalizeLanguage(value) {
				if (typeof value !== "string") return null;
				const code = value.trim().toLowerCase().replaceAll("_", "-").split("-")[0];
				return Object.hasOwn(SUPPORTED_LANGUAGES, code) ? code : null;
			}

			/** Vælg først et gemt sprog, derefter et understøttet browsersprog og til sidst engelsk. */
			function resolveLanguage(saved, browserLanguages = []) {
				const preferred = normalizeLanguage(saved);
				if (preferred) return preferred;
				for (const language of Array.isArray(browserLanguages) ? browserLanguages : [browserLanguages]) {
					const code = normalizeLanguage(language);
					if (code) return code;
				}
				return "en";
			}

			let currentLanguage = resolveLanguage(storedValue(LANGUAGE_KEY),
				[...(navigator.languages || []), navigator.language]);
			let pendingLanguageFormState = null;

			function localeCode() {
				return SUPPORTED_LANGUAGES[currentLanguage]?.locale || SUPPORTED_LANGUAGES.en.locale;
			}

			/** Slå en tekstnøgle op, og indsæt navngivne værdier én gang. Værdierne oversættes aldrig. */
			function msg(key, params = {}) {
				const catalog = I18N[currentLanguage] || I18N.en;
				const template = Object.hasOwn(catalog, key) ? catalog[key]
					: Object.hasOwn(I18N.en, key) ? I18N.en[key] : key;
				return template.replace(/\{([A-Za-z][A-Za-z0-9_]*)\}/gu, (placeholder, name) =>
					Object.hasOwn(params, name) ? String(params[name]) : placeholder);
			}

			/** HTML-escape hele teksten inklusive parametre, før den indsættes i HTML. */
			function htmlMsg(key, params = {}) {
				return escapeHtml(msg(key, params));
			}

			/** Vælg den korrekte entals- eller flertalsform, og formatér antallet efter sproget. */
			function msgCount(key, count, params = {}) {
				const category = new Intl.PluralRules(localeCode()).select(count);
				// Sprogpakkerne har ental og øvrige antal. Brug også .other til zero, two, few og many.
				const form = category === "one" ? "one" : "other";
				return msg(`${key}.${form}`, { ...params, count: fmtNum(count) });
			}

			/** Oversæt kun elementer og attributter, der udtrykkeligt er knyttet til tekstnøgler. */
			function applyI18n(root = document) {
				for (const [binding, attribute] of [
					["data-i18n", null], ["data-i18n-title", "title"],
					["data-i18n-aria-label", "aria-label"], ["data-i18n-placeholder", "placeholder"],
					["data-i18n-content", "content"]
				]) {
					const elements = [...root.querySelectorAll(`[${binding}]`)];
					if (root.matches?.(`[${binding}]`)) elements.unshift(root);
					for (const element of elements) {
						const text = msg(element.getAttribute(binding), { version: APP_VERSION });
						if (attribute) element.setAttribute(attribute, text);
						else element.textContent = text;
					}
				}
			}

			/** Identificér formularfelter uafhængigt af oversatte etiketter og hjælpetekster. */
			function formFieldSelector(element) {
				if (element.hasAttribute("data-form-state-key")) {
					return `[data-form-state-key="${CSS.escape(element.getAttribute("data-form-state-key"))}"]`;
				}
				if (element.id) return `#${CSS.escape(element.id)}`;
				const attributes = [...element.attributes].filter(attribute =>
					attribute.name.startsWith("data-") || attribute.name === "name");
				if (!attributes.length) return null;
				return element.tagName.toLowerCase() + attributes.map(attribute =>
					`[${CSS.escape(attribute.name)}="${CSS.escape(attribute.value)}"]`).join("");
			}

			/** Bevar ufærdige indtastninger og fokus, når den aktuelle fane tegnes igen. */
			function captureFormState() {
				const root = document.getElementById("tabContent");
				return {
					fields: [...root.querySelectorAll("input, select, textarea")].flatMap(element => {
						const selector = formFieldSelector(element);
						return selector ? [{
							selector, element, value: element.value, checked: element.checked,
							focused: element === document.activeElement,
							start: element.selectionStart, end: element.selectionEnd
						}] : [];
					}),
					details: [...root.querySelectorAll("details")].map(element => element.open)
				};
			}

			/** Bevar kladder ved overlappende sprogskift, og medtag brugerens nyeste indtastninger. */
			function mergeFormState(previous, current) {
				if (!previous) return current;
				const fields = new Map(previous.fields.map(field => [field.selector, { ...field, restoredElement: null }]));
				for (const field of current.fields) {
					const earlier = previous.fields.find(candidate => candidate.selector === field.selector);
					// Et midlertidigt felt, som endnu ikke har fået sin kladde, må ikke overskrive den.
					if (!earlier || earlier.restoredElement === field.element) fields.set(field.selector, field);
				}
				return { fields: [...fields.values()], details: current.details.length ? current.details : previous.details };
			}

			/** Medtag ændringer i felter, der udfyldes asynkront, mens et sprogskift afventer. */
			function recordPendingFormEdit(event) {
				const pending = pendingLanguageFormState;
				const element = event.target;
				if (!pending || pending.generation !== state.renderGen || pending.tab !== state.activeTab
					|| !element.matches?.("input, select, textarea")) return;
				const selector = formFieldSelector(element);
				if (!selector) return;
				let field = pending.snapshot.fields.find(candidate => candidate.selector === selector);
				if (!field) {
					field = { selector };
					pending.snapshot.fields.push(field);
				}
				Object.assign(field, {
					element, restoredElement: element, value: element.value,
					checked: element.checked, focused: element === document.activeElement,
					start: element.selectionStart, end: element.selectionEnd
				});
			}

			function restoreFormState(snapshot) {
				const root = document.getElementById("tabContent");
				for (const field of snapshot.fields) {
					const element = root.querySelector(field.selector);
					// Bevar både brugerændringer og programmatiske nulstillinger i allerede gendannede felter.
					if (!element || field.restoredElement === element) continue;
					if (element.tagName !== "SELECT" || [...element.options].some(option => option.value === field.value)) {
						element.value = field.value;
						field.restoredElement = element;
					}
					if (typeof field.checked === "boolean") element.checked = field.checked;
					if (field.focused) {
						element.focus({ preventScroll: true });
						if (field.start !== null && typeof element.setSelectionRange === "function") {

			async function loadGroups(server) {
				try {
					const data = await apiCall(server, '/groups');

					const catalog = { byId: new Map(), byName: new Map(), error: null };

						if (!Number.isInteger(group.id) || typeof group.name !== 'string' || catalog.byName.has(group.name))
							throw new Error(msg('common.invalidData'));
						catalog.byId.set(group.id, group); catalog.byName.set(group.name, group);
					}
					groupCatalogs.set(server.id, catalog);

					throw error;
				}

			function groupNames(server, entry) {

			// Listeadresser kan indeholde URL-stier og query-parametre. Find posten i

			async function readGroupEntry(server, kind, snapshot) {
				const data = await apiCall(server, kind === 'lists' ? '/lists' : entryPath(kind, snapshot));
				if (!Array.isArray(data?.[kind])) throw new Error(msg('common.invalidData'));
				return data[kind].find(item => {
					if (snapshot.id !== undefined && item.id !== snapshot.id) return false;
					if (kind === 'domains') return item.domain === snapshot.domain && item.type === snapshot.type && item.kind === snapshot.kind;
					if (kind === 'lists') return item.address === snapshot.address && item.type === snapshot.type;

			function groupEntryUnchanged(kind, current, original) {
				if (!current) return false;
				// Statistik, rækkefølge af felter og rækkefølge af gruppenumre må ikke
				// blokere gemning. Bevar kontrollen af identitet og redigerbare værdier.
				const fields = ['id', 'date_added', ...(kind === 'domains' ? ['domain', 'type', 'kind', 'enabled']
					: kind === 'lists' ? ['address', 'type', 'enabled'] : ['client'])];
				if (fields.some(key => current[key] !== original[key]) || (current.comment || '') !== (original.comment || '')) return false;
				if (!Array.isArray(current.groups) || !Array.isArray(original.groups)) return false;
				const normalized = groups => JSON.stringify([...new Set(groups)].sort((a, b) => a - b));
				return normalized(current.groups) === normalized(original.groups);
			}
			async function editEntryGroups(server, kind, snapshot) {

			/* API-hentninger er afgrænset, så én utilgængelig instans ikke hænger hele forsiden. */
			async function readOverview(server, onUpdate = () => { }, isCurrent = () => true, requestedKeys = null) {
				const row = { server, data: {}, errors: {}, statusPending: true, loading: true };
				await server.sessionCheck;
				if (!isCurrent()) return row;
				if (!server.connected) {
					row.errors.status = server.sessionError || msg('auth.notConnected'); row.statusPending = false; row.loading = false;
					onUpdate(row, 'status'); return row;
				}
				const endpoints = [['summary', '/stats/summary'], ['blocking', '/dns/blocking'], ['version', '/info/version'],
				['groups', '/groups'], ['domains', '/domains'], ['clients', '/clients'], ['lists', '/lists'],
				['hosts', '/config/dns/hosts'], ['cnames', '/config/dns/cnameRecords']].filter(([key]) => !requestedKeys || requestedKeys.includes(key));
				// Højst tre samtidige kald pr. instans.
				for (let offset = 0; offset < endpoints.length; offset += 3) {
					if (!isCurrent()) return row;
					await Promise.all(endpoints.slice(offset, offset + 3).map(async ([key, path]) => {
						try {
							const result = key === 'groups' ? await loadGroups(server) : await apiCall(server, path);
							if (key === 'groups') row.data.groups = [...result.byId.values()];
							else if (['domains', 'clients', 'lists'].includes(key)) {
								if (!Array.isArray(result?.[key])) throw new Error(msg('common.invalidData'));
								row.data[key] = result[key];
							} else if (key === 'hosts' || key === 'cnames') {
								const value = result?.config?.dns?.[key === 'hosts' ? 'hosts' : 'cnameRecords'];
								if (!Array.isArray(value)) throw new Error(msg('common.invalidData'));
								row.data[key] = value;
							} else {
								if (!result || typeof result !== 'object') throw new Error(msg('common.invalidData'));
								row.data[key] = result;
							}
						} catch (error) { row.errors[key] = error.message; }
					}));
					if (!isCurrent()) return row;
					if (!server.connected) {
						row.statusPending = false; row.loading = false;
						row.errors.status = msg('auth.notConnected');
						onUpdate(row, 'status'); return row;
					}
					if (offset === 0) row.statusPending = false;
					if (offset + 3 >= endpoints.length) row.loading = false;
					onUpdate(row, offset === 0 ? 'status' : 'comparison');
				}
				return row;
			}
			function comparisonRecords(row, category) {
				const array = row.data[category];
				if (!Array.isArray(array)) throw new Error(row.errors[category] || row.errors.status || msg(row.loading ? 'common.loading' : 'common.unknown'));
				const records = new Map();
				if (category === 'hosts') {
					for (const entry of array) {
						const [ip, ...names] = entry.trim().split(/\s+/u);
						if (!ip || !names.length) throw new Error(msg('common.invalidData'));
						for (const name of names) {
							const key = name.toLowerCase();
							const ips = records.get(key)?.ips || [];
							records.set(key, { ips: [...new Set([...ips, ip.toLowerCase()])].sort() });
						}


					}
					return records;
				}
				for (const entry of array) {
					let key, value;
					if (category === 'groups') { key = entry.name; value = { enabled: !!entry.enabled, comment: entry.comment || '' }; }
					else if (category === 'cnames') {
						const [name, target, ttl] = entry.split(',').map(v => v.trim());
						if (!name || !target) throw new Error(msg('common.invalidData'));
						key = name.toLowerCase(); value = { target: target.toLowerCase(), ttl: ttl || '' };
					} else {
						if (category === 'domains') key = [entry.kind === 'regex' ? entry.domain : entry.domain.toLowerCase(), entry.type, entry.kind].join(' · ');
						else if (category === 'lists') key = [entry.address, entry.type].join(' · ');
						else key = String(entry.client).toUpperCase();
						value = { groups: groupNames(row.server, entry), comment: entry.comment || '' };
						if (category === 'domains') value.type = entry.type;
						if (category !== 'clients') value.enabled = !!entry.enabled;

			async function downloadBackups(servers, output) {
				if (output) output.replaceChildren();
				let successful = true;
				for (const server of servers) {
					const line = document.createElement('div');
					if (output) output.append(line);
					line.textContent = server.label + ': ' + msg('common.loading');

						const response = await apiCall(server, '/teleporter', { rawResponse: true, timeoutMs: 60000 });
						if (!response.ok) throw new Error('HTTP ' + response.status);
						const blob = await response.blob();
						const type = (response.headers.get('content-type') || '').toLowerCase();
						if (!blob.size || type.includes('json') || type.includes('text/html')) throw new Error(msg('backup.invalidArchive'));
						const bytes = new Uint8Array(await blob.slice(0, 4).arrayBuffer());
						let extension;
						if (bytes[0] === 0x50 && bytes[1] === 0x4b) extension = '.zip';
						else if (bytes[0] === 0x1f && bytes[1] === 0x8b) extension = '.tar.gz';
						else throw new Error(msg('backup.invalidArchive'));
						const now = new Date();
						const stamp = [now.getFullYear(), String(now.getMonth() + 1).padStart(2, '0'), String(now.getDate()).padStart(2, '0')].join('-') + '-'
							+ [now.getHours(), now.getMinutes(), now.getSeconds()].map(n => String(n).padStart(2, '0')).join('');
						const filename = 'pihole-' + server.label.replace(/[^\p{L}\p{N}._-]+/gu, '_') + '-' + stamp + extension;
						const link = document.createElement('a'), url = URL.createObjectURL(blob);
						link.href = url; link.download = filename; document.body.append(link); link.click(); link.remove();
						setTimeout(() => URL.revokeObjectURL(url), 60000);
						line.textContent = msg('backup.downloadStarted', { server: server.label, file: filename });
					} catch (error) {
						successful = false; line.textContent = server.label + ': ' + apiError(error).message + ' ';
						const retry = document.createElement('button'); retry.className = 'btn xs'; retry.textContent = msg('common.retry');
						retry.onclick = () => { retry.disabled = true; downloadBackups([server], line).finally(() => { retry.disabled = false; }); };
						line.append(retry);
					}
				}
				return successful;
			}

			function ansiToHtml(raw) {
				raw = raw.replaceAll('\r\n', '\n').replaceAll('\r', '\n');
				const colors = ['gray', 'red', 'green', 'yellow', 'blue', 'purple', 'cyan', 'gray'];
				let color = '', bold = false, offset = 0, html = '';
				const text = value => {
					const classes = [bold ? 'ansi-bold' : '', color ? 'ansi-' + color : ''].filter(Boolean).join(' ');
					const escaped = escapeHtml(value);
					return classes ? `<span class="${classes}">${escaped}</span>` : escaped;
				};
				for (const match of raw.matchAll(/\u001b\[[0-?]*[ -/]*[@-~]/gu)) {
					html += text(raw.slice(offset, match.index)); offset = match.index + match[0].length;
					if (!match[0].endsWith('m')) continue;
					for (const code of (match[0].slice(2, -1) || '0').split(';').map(Number)) {
						if (code === 0) { color = ''; bold = false; }
						else if (code === 1) bold = true;
						else if (code === 22) bold = false;
						else if (code === 39) color = '';
						else if (code >= 30 && code <= 37) color = colors[code - 30];
						else if (code >= 90 && code <= 97) color = colors[code - 90];
					}
				}
				return html + text(raw.slice(offset));
			}

			function parseGravityLog(raw) {
				const clean = raw.replace(/\u001b\[[0-?]*[ -/]*[@-~]/gu, '').replace(/\r/g, '\n');
				const warnings = [], failures = [];
				for (const line of clean.split('\n')) {
					const marked = line.match(/^\s*\[\s*[✗✘]\s*\]\s*(.*)$/u);
					if (marked) {
						if (/^(?:Status:|List download failed:)/i.test(marked[1])) warnings.push(line.trim());
						else failures.push(line.trim());
					} else if (/^\s*(?:\[[i!]\]\s*)?(?:fatal error\s*:|aborted\s*(?::|$)|user-abort detected\b)/iu.test(line)) failures.push(line.trim());
				}
				const completed = /^\s*\[\s*[✓✔]\s*\]\s+Swapping databases\b/imu.test(clean)
					&& /^\s*\[\s*[✓✔]\s*\]\s+Cleaning up stray matter\b/imu.test(clean);
				return { warnings: [...new Set(warnings)], failures: [...new Set(failures)], failed: failures.length > 0, completed };
			}
			async function runGravity(server) {
				if (!server.connected || [...state.gravityRuns.values()].some(run => run.running)) throw new Error(msg('gravity.busy'));
				const run = gravityRun(server);
				const before = await apiCall(server, '/stats/summary');
				Object.assign(run, { running: true, status: 'running', rawLog: '', error: '', warnings: [] }); paintQueue();
				try {
					const response = await apiCall(server, '/action/gravity?color=true', { method: 'POST', rawResponse: true, timeoutMs: 30 * 60 * 1000 });
					if (!response.ok) throw new Error('HTTP ' + response.status);
					if (!response.body) throw new Error(msg('gravity.unconfirmed'));
					if ((response.headers.get('content-type') || '').includes('application/json')) throw new Error(msg('gravity.unconfirmed'));
					const reader = response.body.getReader(), decoder = new TextDecoder();
					try {
						for (; ;) {
							const { done, value } = await reader.read();
							if (done) break;
							run.rawLog += decoder.decode(value, { stream: true }); paintQueue();
						}
						run.rawLog += decoder.decode();
					} finally { reader.releaseLock(); }
					const result = parseGravityLog(run.rawLog);
					run.warnings = result.warnings;
					if (result.failed) throw new Error(msg('gravity.failed') + '\n' + result.failures[0]);
					const after = await apiCall(server, '/stats/summary');
					const oldTime = before?.gravity?.last_update, newTime = after?.gravity?.last_update;
					// Stream-EOF er ikke nok. Kræv ny tidsmarkør eller den dokumenterede afslutning i loggen.
					if (!(typeof newTime === 'number' && newTime > (oldTime || 0))
						&& !result.completed) throw new Error(msg('gravity.unconfirmed'));
					run.lastUpdate = newTime; run.status = 'done'; pendingGravity.delete(server.id);
					return Date.now() / 1000;
				} catch (error) { run.status = 'error'; run.error = apiError(error).message; throw new Error(run.error, { cause: error }); }
				finally { run.running = false; paintQueue(); }
			}
			function successfulQuery(query, since) {
				return Number(query.time) >= since && ['IP', 'CNAME', 'DOMAIN', 'RRNAME', 'BLOB', 'DNSSEC'].includes(query.reply?.type);
			}
			async function checkDnsActivity(server, since) {
				const deadline = Date.now() + GRAVITY_CHECK_SECONDS * 1000;
				while (Date.now() < deadline && !gravityQueue.stop) {
					await apiCall(server, '/dns/blocking'); // API-fejl stopper køen; manglende logadgang giver manuel kontrol.
					try {
						const data = await apiCall(server, '/queries?from=' + since + '&length=100');
						if (Array.isArray(data?.queries) && data.queries.some(query => successfulQuery(query, since))) return true;
					} catch (error) { if (error instanceof AuthError) throw error; return false; }
					await new Promise(resolve => setTimeout(resolve, 2500));
				}
				return false;
			}
			function readGravityPreparation(server) {
				return readOverview(server, undefined, undefined, ['summary', 'blocking', 'groups', 'lists']);
			}
			async function startGravityQueue(servers) {
				if (gravityQueue.active || [...state.gravityRuns.values()].some(run => run.running)) throw new Error(msg('gravity.busy'));
				if (!servers.length) throw new Error(msg('common.selectInstances'));
				// Lås straks, også mens forberedelsen henter data.
				gravityQueue.active = true; gravityQueue.stop = false; gravityQueue.items = []; gravityQueue.current = null; paintQueue();
				try {
					const rows = await Promise.all(servers.map(readGravityPreparation));
					for (const row of rows) if (!row.data.summary || !row.data.blocking) throw new Error(msg('overview.apiUnavailable') + ': ' + row.server.label);
					const listComparison = compareCategory(rows, 'lists');
					const differ = listComparison.missing.length || listComparison.conflicts.length;
					const warning = differ ? msg('gravity.listsDiffer') : listComparison.unavailable.length ? msg('gravity.listsUnknown') : '';
					const ordered = [...rows].sort((a, b) => (gravityInfo(a).time || 0) - (gravityInfo(b).time || 0));
					if (servers.length > 1 && !uiConfirm([msg('gravity.confirmQueue'), ordered.map(row => row.server.label).join(' → '), warning, msg('gravity.queueHint')].filter(Boolean).join('\n\n'))) return;
					gravityQueue.items = ordered.map(row => ({ server: row.server, status: 'waiting', error: '' }));
					for (const item of gravityQueue.items) {
						if (gravityQueue.stop) break;
						gravityQueue.current = item.server; item.status = 'updating'; paintQueue();
						try {
							const since = await runGravity(item.server);
							item.warningCount = gravityRun(item.server).warnings.length;
							item.status = 'checking'; paintQueue();
							const automatic = await checkDnsActivity(item.server, since);
							if (gravityQueue.stop) { item.status = automatic ? 'done' : 'updated'; break; }
							if (!automatic) {
								item.status = 'confirmation';
								const confirmed = await new Promise(resolve => { gravityQueue.resume = resolve; paintQueue(); });
								gravityQueue.resume = null;
								if (!confirmed) { item.status = 'updated'; break; }
								await apiCall(item.server, '/dns/blocking');
							}
							item.status = 'done';
						} catch (error) { item.status = 'failed'; item.error = error.message; break; }
						paintQueue();
					}
				} finally {
					for (const item of gravityQueue.items) if (item.status === 'waiting') item.status = 'notStarted';
					gravityQueue.active = false; gravityQueue.resume = null; paintQueue();
					// Genindlæs status uden at miste køens resultat eller fejl.
					if (state.activeTab === 'overview') await switchTab('overview', false);
					else if (state.activeTab === 'gravity') await switchTab('gravity', false);
				}
			}
			async function renderGravityWithQueue(container, generation) {
				container.innerHTML = `<section class="card" style="margin-bottom:14px"><div class="row-inline"><button class="btn primary" id="gravityAll">${htmlMsg('gravity.updateAll')}</button></div><div id="queuePanel"></div></section>
		<div class="overview-grid">${state.servers.map(server => `<article class="card"><h2><span class="tag tag-${escapeHtml(server.chip.slice(1))}">${escapeHtml(server.label)}</span></h2>
		<div class="stat-row"><span>${htmlMsg('gravity.lastUpdate')}</span><span id="gravLast${escapeHtml(server.id)}"></span></div>
		${server.connected ? '' : loginBoxHtml(server)}<button class="btn block" id="gravBtn${escapeHtml(server.id)}">${htmlMsg('gravity.updateServer', { server: server.label })}</button>
		<pre class="log" id="gravLog${escapeHtml(server.id)}"></pre></article>`).join('')}</div>`;
				container.querySelector('#gravityAll').onclick = () => startGravityQueue(state.servers.filter(server => server.connected)).catch(error => toast(error.message, 'err'));
				bindLoginHandlers(container, () => switchTab('gravity', false));
				for (const server of state.servers) {
					const run = gravityRun(server);
					run.statusLoading = server.connected; run.statusError = '';
					container.querySelector('#gravBtn' + server.id).onclick = () => startGravityQueue([server]).catch(error => toast(error.message, 'err'));
				}
				paintQueue();
				await Promise.all(state.servers.map(async server => {
					const run = gravityRun(server);
					if (server.connected) {
						try { run.lastUpdate = (await apiCall(server, '/stats/summary'))?.gravity?.last_update; }
						catch (error) { run.statusError = error.message; }
						finally { run.statusLoading = false; }
					}
					if (generation === state.renderGen) paintGravity(server);
				}));
			}
			window.addEventListener('beforeunload', event => {
				if (gravityQueue.active || [...state.gravityRuns.values()].some(run => run.running)) { event.preventDefault(); event.returnValue = ''; }
			});

			function downloadLanguageTemplate() {
				const pack = { label: 'Your language', locale: 'en-GB', author: '', messages: { ...I18N.en } };
				const source = '/* Translate values; preserve all keys and {parameters}. Replace xx, label, locale and author.\n'
					+ ' * Compatibility-only messages need not be translated; leave their English text unchanged:\n'
					+ ' * overview.updatedAt, groups.manageHint, queries.rangeDays.one, queries.rangeDays.other.\n'
					+ ' * They are retained so older language packs remain valid. */\n'
					+ 'window.PIHOLE_LANGUAGES = window.PIHOLE_LANGUAGES || {};\nwindow.PIHOLE_LANGUAGES.xx = '
					+ JSON.stringify(pack, null, 2) + ';\n';
				const link = document.createElement('a'), url = URL.createObjectURL(new Blob([source], { type: 'text/javascript;charset=utf-8' }));
				link.href = url; link.download = 'language.template.js'; document.body.append(link); link.click(); link.remove();
				setTimeout(() => URL.revokeObjectURL(url), 60000);
			}


			async function bootstrap() {
				initI18n(); initThemeToggle(); initVersionCheck();
				state.activeTab = tabFromHash(); renderPills();
				for (const server of state.servers) {
					server.sessionCheck = checkSession(server).finally(renderPills);
				}
				await switchTab(state.activeTab, false);
			}
			// Start kontrolpanelet.
			window.addEventListener("hashchange", () => {
				const t = tabFromHash();
				if (t !== state.activeTab) void switchTab(t, false);
				else if (t === 'hosts' && location.hash.toLowerCase() === '#cnames')
					document.getElementById('cnameSection')?.scrollIntoView({block: 'start'});
			}),
				renderTabs(),
				bootstrap();
		</script>
	</body>
